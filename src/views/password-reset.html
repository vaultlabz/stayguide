<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - StayGuide</title>
    <!-- 2026-10-09 12:18, #56 forgot / reset password: without ?token asks for the email, with ?token sets the new password. Styles from login.html -->
    <!-- 2026-10-03 15:31, shared design tokens + light/dark theme (set before paint to avoid a flash) -->
    <link rel="stylesheet" href="/css/theme.css">
    <!-- 2026-10-06 15:50, Snow-kit admin skin (Inter via Google Fonts, allowed by CSP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/css/admin-kit.css">
    <script src="/js/theme.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            background: var(--accent);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: var(--surface);
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            color: var(--accent-text);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .logo p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        .company-info {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
        }
        
        .company-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }
        
        .company-slug {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-2);
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }
        
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: var(--on-accent);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .btn:hover {
            background: var(--accent-hover);
        }
        
        .btn:disabled {
            background: var(--disabled-bg);
            cursor: not-allowed;
        }
        
        .error {
            background: var(--danger-bg);
            color: var(--danger-text);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        .success {
            background: var(--success-bg);
            color: var(--success-text);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        .back-link {
            text-align: center;
            margin-top: 2rem;
        }
        
        .back-link a {
            color: var(--accent-text);
            text-decoration: none;
            font-size: 0.875rem;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }
        
        .spinner {
            border: 2px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="sg-auth snow">
    <main class="login-container">
        <div class="logo">
            <h1>StayGuide</h1>
            <p id="subtitle">Reset your password</p>
        </div>

        <div id="error-message" class="error" role="alert" style="display: none;"></div>
        <div id="success-message" class="success" role="status" style="display: none;"></div>

        <form id="requestForm" hidden>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-input" autocomplete="username" required autofocus>
            </div>
            <button type="submit" class="btn">Email me a reset link</button>
        </form>

        <form id="resetForm" hidden>
            <div class="form-group">
                <label class="form-label" for="password">New password</label>
                <input type="password" id="password" class="form-input" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm">Confirm new password</label>
                <input type="password" id="confirm" class="form-input" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <button type="submit" class="btn">Set new password</button>
        </form>

        <div class="back-link">
            <a href="/login" id="signin-link">&larr; Back to sign in</a>
        </div>
    </main>

    <script>
        const token = new URLSearchParams(location.search).get('token');
        const errorBox = document.getElementById('error-message');
        const okBox = document.getElementById('success-message');
        const show = (box, text) => { errorBox.style.display = okBox.style.display = 'none'; box.textContent = text; box.style.display = 'block'; };
        const post = async (url, body) => {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
            return data;
        };
        const busy = (form, on) => form.querySelectorAll('button, input').forEach(el => { el.disabled = on; });

        const requestForm = document.getElementById('requestForm');
        const resetForm = document.getElementById('resetForm');
        if (token) {
            // keep the token out of the address bar (and history / referrers) once read
            history.replaceState(null, '', '/reset-password');
            document.getElementById('subtitle').textContent = 'Choose a new password';
            resetForm.hidden = false;
            document.getElementById('password').focus();
        } else {
            requestForm.hidden = false;
        }

        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            busy(requestForm, true);
            try {
                const data = await post('/forgot-password', { email: document.getElementById('email').value.trim() });
                show(okBox, data.message);
                requestForm.hidden = true;
            } catch (err) { show(errorBox, err.message); busy(requestForm, false); }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('confirm').value) return show(errorBox, 'The two passwords do not match.');
            busy(resetForm, true);
            try {
                const data = await post('/reset-password', { token, password });
                show(okBox, data.message);
                resetForm.hidden = true;
                const link = document.getElementById('signin-link');
                link.href = data.redirect; link.textContent = 'Sign in';
            } catch (err) {
                show(errorBox, err.message);
                busy(resetForm, false);
                if (/expired|invalid/i.test(err.message)) { resetForm.hidden = true; requestForm.hidden = false; }
            }
        });
    </script>
</body>
</html>
